# Add 800ms of latency to traffic leaving checkoutservice for 3 minutes (slow checkout, gRPC deadlines).
# Apply: kubectl apply -f infra/chaos-mesh-experiments/network-delay-checkoutservice.yaml
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: network-delay-checkoutservice
  namespace: online-boutique
spec:
  action: delay
  mode: all
  duration: 3m
  selector:
    namespaces: [online-boutique]
    labelSelectors:
      app: checkoutservice
  delay:
    latency: 800ms
    jitter: 100ms
    correlation: "50"
